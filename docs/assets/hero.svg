<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">QingMonitor — 让性能数据，安静待在桌面一角</title>
  <desc id="desc">两行性能悬浮窗的设计示意，包含 CPU、GPU、内存、显存、硬盘、功率、读写和 FPS。所有数值均为示例数据，不是实际硬件读数或性能测量。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf6ff"/><stop offset=".55" stop-color="#f4f3ff"/><stop offset="1" stop-color="#f9f5fc"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".92"/><stop offset="1" stop-color="#ffffff" stop-opacity=".62"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#80caff"/><stop offset="1" stop-color="#b8a7ec"/></linearGradient>
    <radialGradient id="blue"><stop stop-color="#9dd5ff" stop-opacity=".52"/><stop offset="1" stop-color="#9dd5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#c9b4f5" stop-opacity=".45"/><stop offset="1" stop-color="#c9b4f5" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-15%" y="-70%" width="130%" height="260%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#778da8" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <ellipse cx="210" cy="290" rx="340" ry="240" fill="url(#blue)"/>
  <ellipse cx="1060" cy="240" rx="350" ry="260" fill="url(#violet)"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="80" y="68" font-size="14" font-weight="700" letter-spacing="3" fill="#4c7299">QINGMONITOR</text>
    <rect x="1060" y="44" width="140" height="30" rx="15" fill="#ffffff" fill-opacity=".7" stroke="#dce5f2"/>
    <text x="1130" y="64" text-anchor="middle" font-size="12" fill="#65758c">0.1.11 · Windows</text>
    <text x="80" y="143" font-size="43" font-weight="700" letter-spacing="1" fill="#1e3045">两行读数。一眼看清。</text>
    <text x="82" y="181" font-size="18" fill="#66778e">按需显示性能数据，把桌面留给正在做的事。</text>
    <rect x="64" y="222" width="1152" height="145" rx="35" fill="url(#accent)" opacity=".18"/>
    <rect x="84" y="244" width="1112" height="99" rx="23" fill="url(#glass)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
    <g font-size="13" fill="#68798f"><text x="109" y="280">占用</text><text x="109" y="317">温度</text></g>
    <g font-size="15" fill="#55677d">
      <text x="166" y="280">CPU</text><text x="294" y="280">GPU</text><text x="423" y="280">内存</text><text x="553" y="280">显存</text><text x="683" y="280">硬盘</text>
      <text x="166" y="317">CPU</text><text x="294" y="317">GPU</text><text x="423" y="317">硬盘</text>
      <text x="821" y="280">功率</text><text x="821" y="317">读取</text><text x="1002" y="280">FPS</text><text x="1002" y="317">写入</text>
    </g>
    <g font-size="20" font-weight="600" fill="#243b55">
      <text x="207" y="281">24%</text><text x="336" y="281">18%</text><text x="465" y="281">42%</text><text x="595" y="281">31%</text><text x="725" y="281">12%</text>
      <text x="863" y="281">45 W</text><text x="1047" y="281">60</text>
    </g>
    <g font-size="19" font-weight="600" fill="#32a280"><text x="207" y="318">54°</text><text x="336" y="318">42°</text><text x="465" y="318">36°</text></g>
    <g font-size="16" font-weight="600" fill="#243b55"><text x="863" y="317">12 MB/s</text><text x="1047" y="317">4 MB/s</text></g>
    <path d="M791 264V324" stroke="#d9e2ed"/>
    <g stroke="#60b7ef" stroke-width="2.4" stroke-linecap="round"><path d="M1147 279h17m-17 7h17m-17 7h17"/></g>
    <text x="1195" y="391" text-anchor="end" font-size="12" fill="#7c8798">设计示意 · 示例数据</text>
    <g font-size="14" fill="#586f89">
      <rect x="80" y="435" width="154" height="40" rx="20" fill="#fff" fill-opacity=".7" stroke="#e0e7f1"/><text x="157" y="460" text-anchor="middle">玻璃外观 · 可调</text>
      <rect x="249" y="435" width="154" height="40" rx="20" fill="#fff" fill-opacity=".7" stroke="#e0e7f1"/><text x="326" y="460" text-anchor="middle">分组采集 · 可选</text>
      <rect x="418" y="435" width="154" height="40" rx="20" fill="#fff" fill-opacity=".7" stroke="#e0e7f1"/><text x="495" y="460" text-anchor="middle">独立 FPS · 手动</text>
      <rect x="587" y="435" width="154" height="40" rx="20" fill="#fff" fill-opacity=".7" stroke="#e0e7f1"/><text x="664" y="460" text-anchor="middle">性能数据 · 本地</text>
    </g>
    <text x="80" y="522" font-size="13" fill="#8a95a5">独立桌面悬浮窗 / .NET Framework 4.8 / 原创代码 MIT</text>
    <path d="M1057 471h31l12-16 12 29 15-43 14 30h58" fill="none" stroke="#95b5da" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
